<nav class="tabs" id="tabs"></nav><script>

const tabs=[['home','Accueil'],['mood','Mood'],['hobbies','Hobbies'],['sport','Sport'],['nutrition','Nutrition'],['culture','Culture'],['todo','To do'],['courses','Courses'],['appart','Appart'],['envies','Envies'],['profil','Profil']];

const baseFoods=[
{name:'Petit-déjeuner Margot',cat:'Favori',kcal:188,prot:18.3,note:'Skyr fraise + billes Koro + eau de coco + cranberry'},
{name:'Danone Skyr fraise 145 g',cat:'Favori',kcal:102,prot:12.5},{name:'Billes chocolatées Koro 10 g',cat:'Favori',kcal:36,prot:5.8},{name:'Eau de coco 200 ml',cat:'Favori',kcal:40,prot:0},{name:'Jus cranberry sans sucre 200 ml',cat:'Favori',kcal:10,prot:0},
{name:'Yaourt fromage blanc Danone protéiné vanille',cat:'Frigo',kcal:150,prot:20},{name:'Crème dessert Danone protéinée',cat:'Frigo',kcal:150,prot:20},{name:'Petits suisses',cat:'Frigo',kcal:85,prot:7},{name:'Babybel',cat:'Frigo',kcal:70,prot:5},{name:'Carrés frais',cat:'Frigo',kcal:50,prot:3},{name:'Crackers protéinés Kargs',cat:'Frigo',kcal:120,prot:8},{name:'Tortillas protéinées Gerlinéa',cat:'Frigo',kcal:120,prot:12},{name:'Viande des Grisons',cat:'Frigo',kcal:80,prot:14},{name:'Houmous',cat:'Frigo',kcal:170,prot:6},{name:'Banane',cat:'Frigo',kcal:105,prot:1.3},{name:'Melon',cat:'Frigo',kcal:60,prot:1},{name:'Pastèque',cat:'Frigo',kcal:45,prot:1},{name:'Jambon de dinde',cat:'Frigo',kcal:90,prot:18},{name:'Œuf',cat:'Frigo',kcal:75,prot:6},
{name:'Repas PrepMyMeal standard',cat:'PrepMyMeal',kcal:520,prot:45},{name:'Repas PrepMyMeal léger',cat:'PrepMyMeal',kcal:420,prot:38},{name:'Repas PrepMyMeal très protéiné',cat:'PrepMyMeal',kcal:650,prot:60},
{name:'Pinte bière blonde',cat:'Alcool',kcal:210,prot:2},{name:'Spritz',cat:'Alcool',kcal:180,prot:0},{name:'Verre de rosé',cat:'Alcool',kcal:95,prot:0},{name:'Coupe de champagne',cat:'Alcool',kcal:85,prot:0}
];

function defaultState(){return {points:0,totalPoints:0,suggestion:'Choisis une carte pour recevoir une idée douce.',daily:{date:today(),skincare:false,stretch:false,steps:0,proteinBonus:false},week:{sport:0,skincare:0,stretch:0,stepsDays:0},hobbies:{Lecture:0,Photo:0,Ménage:0,Animaux:0,Amis:0,Famille:0},todo:[],courses:[],appart:[],envies:[],sportSessions:[],mensurations:[],foods:baseFoods,mealLog:[],culture:[...cultureSeed.map(t=>({id:id(),type:'Film',cat:'Films à voir',title:t,status:'À voir',rating:0,fav:false})),...disney.map(t=>({id:id(),type:'Film',cat:'Disney',title:t,status:'À voir',rating:0,fav:false})),...marvel.map(t=>({id:id(),type:t.includes('Vision')||t==='Loki'||t==='Hawkeye'||t==='Moon Knight'||t==='Ms Marvel'||t.includes('Falcon')?'Série':'Film',cat:'Marvel',title:t,status:'À voir',rating:0,fav:false}))],rewards:[],backup:''}}
let S=load();function load(){try{return {...defaultState(),...JSON.parse(localStorage.getItem(KEY)||'{}')}}catch(e){return defaultState()}} function save(){localStorage.setItem(KEY,JSON.stringify(S))}
function addPts(n,why){S.points+=n;S.totalPoints+=n;save();flash((n>0?'+':'')+n+' pts · '+why)} function flash(t){S.suggestion=t;save();renderHome()}
function ensureDay(){if(S.daily.date!==today()){S.daily={date:today(),skincare:false,stretch:false,steps:0,proteinBonus:false};save()}}
function nav(to){document.querySelectorAll('main').forEach(m=>m.classList.remove('active'));q(to).classList.add('active');document.querySelectorAll('.tabs button').forEach(b=>{let a=b.dataset.tab===to;b.classList.toggle('active',a);if(a)b.scrollIntoView({behavior:'smooth',inline:'center',block:'nearest'})});render(to)}
function initTabs(){q('tabs').innerHTML=tabs.map(t=>`<button data-tab="${t[0]}" onclick="nav('${t[0]}')">${t[1]}</button>`).join('');q('tabs').querySelector('button').classList.add('active')}
function pct(a,b){return Math.min(100,Math.round((a/b)*100||0))} function card(t){return `<div class="card">${t}</div>`}
function renderHome(){ensureDay();let open=S.todo.filter(x=>!x.done).length; q('home').innerHTML=`<div class="grid3">${[['⭐','Points',S.points],['💪','Sport',S.week.sport+'/4'],['🌿','Skincare',S.week.skincare+'/7'],['🧘','Stretching',S.week.stretch+'/7'],['👣','Pas',euro(S.daily.steps)+'/10k'],['📅','To do',open]].map(x=>`<div class="stat"><span>${x[0]} ${x[1]}</span><b>${x[2]}</b></div>`).join('')}</div>${card(`<div class="mini">Actions rapides</div><div class="grid" style="margin-top:10px"><button class="btn nude" onclick="idea('anti')">🎲 Anti-scroll</button><button class="btn nude" onclick="idea('mood')">😊 Mood</button><button class="btn nude" onclick="idea('task')">📅 Tâche douce</button><button class="btn nude" onclick="idea('culture')">🍿 Culture surprise</button></div><div class="section-title">✨ Suggestion du moment</div><p>${S.suggestion}</p>`)}${card(`<div class="section-title">Mes quotidiens</div><div class="list"><div class="item compact"><span class="emoji">🌿</span><b>Skincare</b><button class="btn light" onclick="toggleDaily('skincare')">${S.daily.skincare?'Fait':'À faire'}</button></div><div class="item compact"><span class="emoji">🧘</span><b>Stretching</b><button class="btn light" onclick="toggleDaily('stretch')">${S.daily.stretch?'Fait':'À faire'}</button></div><div class="item"><div class="titleline"><b>👣 Pas</b><span>${euro(S.daily.steps)} / 10 000</span></div><div class="progress"><div class="bar" style="width:${pct(S.daily.steps,10000)}%"></div></div><div class="row" style="margin-top:10px"><input id="stepsInput" type="number" placeholder="Nombre de pas"><button class="btn light" onclick="setSteps()">Mettre à jour</button><button class="btn light" onclick="S.daily.steps+=1000;if(S.daily.steps>=10000)addPts(score.steps,'10k pas');save();renderHome()">+1000</button></div></div></div>`)}${card(`<div class="section-title">🍽 Nutrition aujourd’hui</div>${nutritionSummary()}<button class="btn sage" onclick="nav('nutrition')">Ouvrir Nutrition</button>`)}${card(`<div class="section-title">Demain</div>${tomorrowTasks()}`)}`}
function nutritionTotals(){let logs=S.mealLog.filter(x=>x.date===today());return logs.reduce((a,x)=>({kcal:a.kcal+Number(x.kcal||0),prot:a.prot+Number(x.prot||0)}),{kcal:0,prot:0})} function nutritionSummary(){let n=nutritionTotals();return `<div class="item"><div class="titleline"><b>Calories</b><span>${Math.round(n.kcal)} / 1700</span></div><div class="progress"><div class="bar" style="width:${pct(n.kcal,1700)}%"></div></div></div><div class="item"><div class="titleline"><b>Protéines</b><span>${Math.round(n.prot)} / 120 g</span></div><div class="progress"><div class="bar" style="width:${pct(n.prot,120)}%"></div></div></div>`}
function tomorrowTasks(){let d=new Date();d.setDate(d.getDate()+1);let td=d.toISOString().slice(0,10);let arr=S.todo.filter(x=>!x.done&&x.date===td);return arr.length?arr.map(x=>`<div class="item">📅 ${x.title}</div>`).join(''):'<p class="small">Aucune tâche datée demain. Une seule priorité suffit.</p>'}
function toggleDaily(k){ensureDay();if(!S.daily[k]){S.daily[k]=true;if(k==='skincare'){S.week.skincare++;addPts(score.skincare,'skincare')}if(k==='stretch'){S.week.stretch++;addPts(score.stretch,'stretching')}}else S.daily[k]=false;save();renderHome()}
function setSteps(){let v=Number(q('stepsInput').value||0);S.daily.steps=v;if(v>=10000)addPts(score.steps,'10k pas');save();renderHome()}
function idea(kind){let pools={anti:['Lire 10 pages puis poser le téléphone.','Faire une mini marche de 15 minutes.','Ranger une petite zone pendant 8 minutes.','Préparer une boisson et regarder un film de ta watchlist.'],mood:['Choisis ton humeur dans l’onglet Mood pour une suggestion plus précise.','Si tu es fatiguée : skincare + lecture douce.','Si tu es motivée : sport ou projet appart.'],task:S.todo.filter(x=>!x.done).map(x=>'📅 '+x.title),culture:S.culture.filter(x=>x.status!=='Vu').map(x=>x.type==='Livre'?'📚 '+x.title:x.type==='Série'?'📺 '+x.title:x.type==='Animé'?'🍿 '+x.title:'🎬 '+x.title)};let p=pools[kind]||[];S.suggestion=p.length?p[Math.floor(Math.random()*p.length)]:'Rien à proposer pour le moment.';save();renderHome()}
function renderMood(){q('mood').innerHTML=card(`<div class="section-title">Comment tu te sens ?</div><div class="grid">${['😴 Fatiguée','😔 Moral bas','😐 Bof','😊 Bien','🚀 Motivée','🤯 Stressée','🥰 Heureuse'].map(m=>`<button class="btn light" onclick="S.mood='${m}';save();renderMood()">${m}</button>`).join('')}</div><div class="section-title">De quoi tu as besoin ?</div><div class="grid">${['Réconfort','Bouger','Voir du monde','Créer','Déconnecter','Avancer'].map(b=>`<button class="btn sage" onclick="moodIdea('${b}')">${b}</button>`).join('')}</div><p class="small">Mood actuel : ${S.mood||'non renseigné'}</p>`)}
function moodIdea(b){let map={Réconfort:'Skincare + thé + lecture 10 pages.',Bouger:'Marche 20 min ou stretching doux.',Créer:'Sortie photo ou note appart inspiration.',Déconnecter:'Culture surprise feel good.',Avancer:'Une seule tâche prioritaire suffit.',"Voir du monde":'Envoyer un message à une personne que tu aimes.'};S.suggestion='Mood · '+(S.mood||'Aujourd’hui')+' · '+map[b];save();nav('home')}
function renderHobbies(){let hs=['Sport','Lecture','Photo','Ménage','Animaux','Amis','Famille','Développement perso','Actualité','Jeux vidéo'];q('hobbies').innerHTML=`<div class="section-title">Hobbies</div><div class="list">${hs.map(h=>`<div class="item compact"><span class="emoji">${{Sport:'💪',Lecture:'📖',Photo:'📸',Ménage:'🧹',Animaux:'🐾',Amis:'🤍',Famille:'🏡','Développement perso':'✨',Actualité:'📰','Jeux vidéo':'🎮'}[h]}</span><b>${h}</b><div class="row"><button class="btn light" onclick="incHobby('${h}',-1)">−</button><span>${S.hobbies[h]||0}</span><button class="btn light" onclick="incHobby('${h}',1)">+</button></div></div>`).join('')}</div>`}
function incHobby(h,n){S.hobbies[h]=Math.max(0,(S.hobbies[h]||0)+n);if(n>0){let pts=h==='Ménage'?score.menage:h==='Photo'?score.photo:h==='Sport'?score.sport:5; if(h==='Sport')S.week.sport++; addPts(pts,h)}save();renderHobbies();renderHome()}
function renderSport(){let km=S.sportSessions.filter(x=>(x.date||'').slice(0,7)===month()).reduce((a,x)=>a+Number(x.km||0),0);q('sport').innerHTML=`<div class="grid3">${[['Séances mois',S.sportSessions.filter(x=>(x.date||'').slice(0,7)===month()).length],['Sport semaine',S.week.sport+'/4'],['Stretching',S.week.stretch+'/7'],['Km mois',km.toFixed(1)],['Pas',euro(S.daily.steps)+'/10k'],['Points',S.points]].map(x=>`<div class="stat"><span>${x[0]}</span><b>${x[1]}</b></div>`).join('')}</div>${card(`<div class="section-title">Ajouter une séance</div><div class="grid"><input type="date" id="sportDate" value="${today()}"><select id="sportType"><option>Renfo</option><option>Pilates</option><option>Course à pied</option></select><select id="sportFocus"><option>Haut du corps</option><option>Bas du corps</option><option>Full body</option><option>Abs</option></select><input id="sportKm" type="number" step="0.1" placeholder="Km si course"><input id="sportPace" placeholder="Allure ex 6:20/km"></div><button class="btn sage" onclick="addSport()">Ajouter séance</button>`)}${card(`<div class="section-title">Mensurations</div><div class="grid"><input id="mDate" type="date" value="${today()}"><input id="mWeight" placeholder="Poids"><input id="mWaist" placeholder="Taille"><input id="mHip" placeholder="Hanches"><input id="mThigh" placeholder="Cuisse"><input id="mArm" placeholder="Bras"></div><textarea id="mNote" placeholder="Note"></textarea><button class="btn light" onclick="addMeasure()">Ajouter mensuration</button>`)}<div class="section-title">Historique séances</div><div class="list">${S.sportSessions.slice(-10).reverse().map(s=>`<div class="item">${s.date} · ${s.type} · ${s.focus||''} ${s.km?`· ${s.km} km`:''} ${s.pace?`· ${s.pace}`:''}</div>`).join('')||'<p class="small">Aucune séance.</p>'}</div>`}
function addSport(){let s={id:id(),date:q('sportDate').value,type:q('sportType').value,focus:q('sportFocus').value,km:q('sportKm').value,pace:q('sportPace').value};S.sportSessions.push(s);S.week.sport++;addPts(score.sport,'séance sport');save();renderSport();renderHome()}
function addMeasure(){S.mensurations.push({id:id(),date:q('mDate').value,weight:q('mWeight').value,waist:q('mWaist').value,hip:q('mHip').value,thigh:q('mThigh').value,arm:q('mArm').value,note:q('mNote').value});save();renderSport()}
function renderNutrition(){let cats=[...new Set(S.foods.map(f=>f.cat))];q('nutrition').innerHTML=`<div class="grid">${card(`<div class="section-title">Aujourd'hui</div>${nutritionSummary()}`)}${card(`<div class="section-title">Objectifs sèche</div><p>Calories : <b>1700 kcal</b></p><p>Protéines : <b>120 g</b></p><button class="btn light" onclick="proteinBonus()">Objectif protéines atteint</button>`)}</div>${card(`<div class="section-title">Favoris rapides</div><select id="foodCat" onchange="renderNutrition()"><option>Toutes catégories</option>${cats.map(c=>`<option ${q('foodCat')&&q('foodCat').value===c?'selected':''}>${c}</option>`).join('')}</select><div class="foodQuick" style="margin-top:10px">${S.foods.filter(f=>!q('foodCat')||q('foodCat').value==='Toutes catégories'||f.cat===q('foodCat').value).map((f,i)=>`<button class="btn light" onclick="addFood(${S.foods.indexOf(f)})">${f.name}<br><span class="small">${f.kcal} kcal · ${f.prot} g prot</span></button>`).join('')}</div>`)}${card(`<div class="section-title">Ajouter un aliment</div><div class="grid"><input id="newFoodName" placeholder="Nom aliment / repas"><select id="newFoodCat"><option>Autre</option><option>PrepMyMeal</option><option>Frigo</option><option>Alcool</option><option>Favori</option></select><input id="newFoodKcal" type="number" placeholder="Calories"><input id="newFoodProt" type="number" step="0.1" placeholder="Protéines g"></div><button class="btn sage" onclick="createFood()">Ajouter à la base</button>`)}<div class="section-title">Journal du jour</div><div class="list">${S.mealLog.filter(x=>x.date===today()).map(x=>`<div class="item titleline"><span>${x.name}<br><span class="small">${x.kcal} kcal · ${x.prot} g protéines</span></span><button class="btn light" onclick="delMeal('${x.id}')">Supprimer</button></div>`).join('')||'<p class="small">Aucun aliment ajouté aujourd’hui.</p>'}</div>`}
function addFood(i){let f=S.foods[i];S.mealLog.push({...f,id:id(),date:today()});save();renderNutrition();renderHome()} function createFood(){S.foods.push({name:q('newFoodName').value||'Aliment',cat:q('newFoodCat').value,kcal:Number(q('newFoodKcal').value||0),prot:Number(q('newFoodProt').value||0)});save();renderNutrition()} function delMeal(i){S.mealLog=S.mealLog.filter(x=>x.id!==i);save();renderNutrition();renderHome()} function proteinBonus(){let n=nutritionTotals();if(n.prot>=120&&!S.daily.proteinBonus){S.daily.proteinBonus=true;addPts(score.protein,'objectif protéines')}else flash('Objectif protéines pas encore atteint ou déjà récompensé aujourd’hui.');save();renderHome()}
function renderCulture(){let t=q('cultureType')?.value||'Tous', c=q('cultureCat')?.value||'Toutes';let cats=[...new Set(S.culture.map(x=>x.cat))];let items=S.culture.filter(x=>(t==='Tous'||x.type===t)&&(c==='Toutes'||x.cat===c));let counts=['Film','Série','Animé','Livre'].map(type=>[type,S.culture.filter(x=>x.type===type&&x.status!=='Vu').length]);q('culture').innerHTML=`<div class="culture-stats">${counts.map(x=>`<div class="stat"><span>${x[0]==='Livre'?'📚 Livres à lire':x[0]==='Série'?'📺 Séries à voir':x[0]==='Animé'?'🍿 Animés à voir':'🎬 Films à voir'}</span><b>${x[1]}</b></div>`).join('')}</div>${card(`<div class="section-title">Culture</div><div class="filterbar"><select id="cultureType" onchange="renderCulture()"><option>Tous</option>${['Film','Série','Animé','Livre'].map(x=>`<option ${t===x?'selected':''}>${x}</option>`).join('')}</select><select id="cultureCat" onchange="renderCulture()"><option>Toutes</option>${cats.map(x=>`<option ${c===x?'selected':''}>${x}</option>`).join('')}</select></div><button class="btn sage" onclick="cultureSurprise()">🍿 Surprise culture</button>`)}<div class="list">${items.slice(0,80).map(x=>`<div class="item"><div class="titleline"><b>${x.type==='Livre'?'📚':x.type==='Série'?'📺':x.type==='Animé'?'🍿':'🎬'} ${x.title}</b><span class="pill">${x.cat}</span></div><div class="row"><button class="btn light" onclick="toggleCulture('${x.id}')">${x.status==='Vu'?'Vu':'À voir'}</button><span class="stars">${[1,2,3,4,5].map(n=>`<button onclick="rateCulture('${x.id}',${n})">${x.rating>=n?'★':'☆'}</button>`).join('')}</span></div></div>`).join('')}</div>`}
function toggleCulture(i){let x=S.culture.find(x=>x.id===i);x.status=x.status==='Vu'?'À voir':'Vu'; if(x.status==='Vu')addPts(x.type==='Livre'?score.livre:x.type==='Série'?score.serie:x.type==='Animé'?score.anime:score.film,x.type+' terminé');save();renderCulture()} function rateCulture(i,n){S.culture.find(x=>x.id===i).rating=n;save();renderCulture()} function cultureSurprise(){let t=q('cultureType')?.value||'Tous';let c=q('cultureCat')?.value||'Toutes';let arr=S.culture.filter(x=>x.status!=='Vu'&&(t==='Tous'||x.type===t)&&(c==='Toutes'||x.cat===c));S.suggestion=arr.length?'Culture surprise · '+arr[Math.floor(Math.random()*arr.length)].title:'Aucun contenu dans cette catégorie.';save();nav('home')}
function listCrudView(name,arr,fields,addFn,renderFn){return ''}
function renderTodo(){q('todo').innerHTML=card(`<div class="section-title">To do</div><div class="grid"><input id="todoTitle" placeholder="Nouvelle tâche"><input id="todoDate" type="date"><select id="todoCat"><option>Perso</option><option>Ménage</option><option>Administratif</option><option>Maison</option><option>Santé</option></select></div><button class="btn sage" onclick="addTodo()">Ajouter</button>`)+`<div class="list">${S.todo.map(x=>`<div class="item ${x.done?'done':''} titleline"><span>📅 ${x.title}<br><span class="small">${x.date||'sans date'} · ${x.cat}</span></span><button class="btn light" onclick="doneTodo('${x.id}')">${x.done?'Réouvrir':'Fait'}</button></div>`).join('')}</div>`}
function addTodo(){S.todo.push({id:id(),title:q('todoTitle').value||'Tâche',date:q('todoDate').value,cat:q('todoCat').value,done:false});save();renderTodo();renderHome()} function doneTodo(i){let x=S.todo.find(x=>x.id===i);x.done=!x.done;if(x.done)addPts(x.cat==='Ménage'?score.menage:score.task,'to do');save();renderTodo();renderHome()}
function renderCourses(){q('courses').innerHTML=card(`<div class="section-title">Courses</div><div class="grid"><input id="courseTitle" placeholder="Article"><input id="courseQty" placeholder="Quantité"><select id="courseCat"><option>Frais</option><option>Épicerie</option><option>Maison</option><option>Beauté</option><option>Animaux</option></select></div><button class="btn sage" onclick="S.courses.push({id:id(),title:q('courseTitle').value,qty:q('courseQty').value,cat:q('courseCat').value,done:false});save();renderCourses()">Ajouter</button>`)+`<div class="list">${S.courses.map(x=>`<div class="item titleline"><span>${x.done?'✅':'☐'} ${x.title} <span class="small">${x.qty||''} · ${x.cat}</span></span><button class="btn light" onclick="x=S.courses.find(a=>a.id==='${x.id}');x.done=!x.done;save();renderCourses()">OK</button></div>`).join('')}</div>`}
function renderAppart(){q('appart').innerHTML=card(`<div class="section-title">Appart</div><div class="grid"><select id="appRoom"><option>Salon</option><option>Cuisine</option><option>Chambre</option><option>Salle de bain</option><option>Entrée</option><option>Rangement</option><option>Inspiration générale</option></select><input id="appTitle" placeholder="Titre"></div><textarea id="appNote" placeholder="Note"></textarea><input id="appPhoto" type="file" accept="image/*"><button class="btn sage" onclick="addAppart()">Ajouter note</button>`)+`<div class="list">${S.appart.map(x=>`<div class="item"><span class="pill">${x.room}</span><h3>${x.title}</h3><p>${x.note||''}</p>${x.photo?`<img class="imgprev" src="${x.photo}">`:''}</div>`).join('')}</div>`}
function addAppart(){let file=q('appPhoto').files[0], base={id:id(),room:q('appRoom').value,title:q('appTitle').value,note:q('appNote').value}; if(file){let r=new FileReader();r.onload=()=>{base.photo=r.result;S.appart.push(base);save();renderAppart()};r.readAsDataURL(file)}else{S.appart.push(base);save();renderAppart()}}
function renderEnvies(){q('envies').innerHTML=card(`<div class="section-title">Envies</div><div class="grid"><input id="envTitle" placeholder="Envie / achat à faire"><input id="envBudget" placeholder="Budget"><select id="envCat"><option>Achat à faire</option><option>Expérience</option><option>Sortie</option><option>Voyage</option><option>Bien-être</option><option>Maison / appart</option></select></div><textarea id="envNote" placeholder="Note"></textarea><button class="btn sage" onclick="S.envies.push({id:id(),title:q('envTitle').value,budget:q('envBudget').value,cat:q('envCat').value,note:q('envNote').value,done:false});save();renderEnvies()">Ajouter</button>`)+`<div class="list">${S.envies.map(x=>`<div class="item"><b>${x.title}</b><br><span class="small">${x.cat} · ${x.budget||''}</span><p>${x.note||''}</p></div>`).join('')}</div>`}
function renderProfil(){let n=nutritionTotals();let km=S.sportSessions.filter(x=>(x.date||'').slice(0,7)===month()).reduce((a,x)=>a+Number(x.km||0),0);q('profil').innerHTML=`${card(`<div class="section-title">Statistiques</div><div class="grid3">${[['Points dispo',S.points],['Points totaux',S.totalPoints],['Sport semaine',S.week.sport+'/4'],['Stretching',S.week.stretch+'/7'],['Pas du jour',euro(S.daily.steps)],['Km mois',km.toFixed(1)],['Calories jour',Math.round(n.kcal)],['Prot jour',Math.round(n.prot)+' g'],['To do ouvertes',S.todo.filter(x=>!x.done).length]].map(x=>`<div class="stat"><span>${x[0]}</span><b>${x[1]}</b></div>`).join('')}</div>`)}${card(`<div class="section-title">Récompenses</div><div class="list">${rewards.map(r=>`<div class="item titleline"><span>${r.emoji} <b>${r.name}</b><br><span class="small">${r.cost} pts</span></span><button class="btn light" onclick="buyReward('${r.name}',${r.cost},'${r.emoji}')">Acheter</button></div>`).join('')}</div><div class="section-title">Obtenues</div>${S.rewards.map(r=>`<div class="item">${r.emoji} ${r.name} · ${r.date}</div>`).join('')||'<p class="small">Aucune pour le moment.</p>'}`)}${card(`<div class="section-title">Sauvegarde</div><button class="btn light" onclick="q('backup').value=JSON.stringify(S)">Exporter</button><textarea id="backup" placeholder="Sauvegarde"></textarea><button class="btn light" onclick="try{S=JSON.parse(q('backup').value);save();render()}catch(e){alert('Sauvegarde invalide')}">Importer</button><button class="btn nude" onclick="if(confirm('Reset semaine uniquement ?')){S.week={sport:0,skincare:0,stretch:0,stepsDays:0};S.daily={date:today(),skincare:false,stretch:false,steps:0,proteinBonus:false};save();render()}">Reset semaine</button>`)}`}
function buyReward(name,cost,emoji){if(S.points<cost){flash('Pas assez de points pour '+name);nav('home');return}S.points-=cost;S.rewards.push({name,cost,emoji,date:today()});flash('Récompense achetée · '+emoji+' '+name);save();renderProfil();}
function render(which){ensureDay();({home:renderHome,mood:renderMood,hobbies:renderHobbies,sport:renderSport,nutrition:renderNutrition,culture:renderCulture,todo:renderTodo,courses:renderCourses,appart:renderAppart,envies:renderEnvies,profil:renderProfil}[which||document.querySelector('main.active').id]||renderHome)()}
initTabs();renderHome();
</script></body></html>
