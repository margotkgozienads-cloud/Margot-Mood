class="sub">Aucune tâche datée demain.</div>'}</div></div></div>`}
function addSteps(n){S.steps[today()]=(S.steps[today()]||0)+n;if(S.steps[today()]>=10000&&!S.routines[today()]?.stepsPoint){S.routines[today()]={...(S.routines[today()]||{}),stepsPoint:true};earn(5,'10k pas')}save()} function setSteps(v){S.steps[today()]=Number(v)||0;save()}
function renderMood(){let moods=['😴 Fatiguée','😔 Moral bas','😐 Bof','😊 Bien','🚀 Motivée','🤯 Stressée','🥰 Heureuse']; q('mood').innerHTML=`<div class="grid"><div class="panel"><h2>Comment tu te sens ?</h2><div class="moodChoice">${moods.map(m=>`<button onclick="moodIdea()"><b>${m}</b><br><span class="sub">Une idée adaptée</span></button>`).join('')}</div></div><div class="suggestion"><b>✨ Idée du moment</b><br><br>${S.moodSuggestion}<div class="row" style="margin-top:14px"><button class="btn sage" onclick="acceptMood()">✅ Ça me va</button><button class="btn soft" onclick="moodIdea()">🔄 Une autre idée</button></div></div></div>`}
function moodIdea(){let arr=['📖 Lire 10 pages','🧘 Faire 10 minutes de stretching','🌿 Faire une skincare lente','📸 Faire 10 photos thème nude/vert','📅 Faire une tâche douce'];let u=S.culture.filter(c=>c.status!=='Vu'&&c.status!=='Lu'); if(u.length) arr.push('🎬 '+u[Math.floor(Math.random()*u.length)].title); S.moodSuggestion=arr[Math.floor(Math.random()*arr.length)]; save()} function acceptMood(){S.homeSuggestion=S.moodSuggestion;save()}
function renderHobbies(){q('hobbies').innerHTML=`<div class="panel"><h2>Hobbies</h2><div class="list">${S.hobbies.map((h,i)=>`<div class="item"><div class="between"><div class="emojiTitle"><span>${h[0]}</span><b>${h[1]}</b></div><b>${h[2]} / ${h[3]}</b></div><div class="row" style="margin-top:8px"><button class="btn small soft" onclick="incHobby(${i},-1)">-</button><button class="btn small sage" onclick="incHobby(${i},1)">+</button></div></div>`).join('')}</div></div>`} function incHobby(i,d){S.hobbies[i][2]=Math.max(0,S.hobbies[i][2]+d);if(d>0)earn(S.hobbies[i][4],S.hobbies[i][1]);save()}
function renderSport(){let km=S.sportSessions.filter(s=>s.date&&s.date.startsWith(month())).reduce((a,s)=>a+(Number(s.km)||0),0);q('sport').innerHTML=`<div class="grid"><div class="cards"><div class="metric"><b>${S.sportSessions.filter(s=>s.date&&s.date.startsWith(month())).length}</b>Séances mois</div><div class="metric"><b>${S.hobbies[0][2]}/4</b>Sport semaine</div><div class="metric"><b>${weekCount('stretch')}/7</b>Stretching</div><div class="metric"><b>${km.toFixed(1)}</b>Km mois</div></div><div class="panel"><h2>Ajouter une séance</h2><div class="grid"><input id="sportDate" type="date" value="${today()}"><select id="sportType"><option>Renfo</option><option>Pilates</option><option>Course à pied</option></select><select id="sportFocus"><option>Haut du corps</option><option>Bas du corps</option><option>Full body</option><option>Abs</option></select><input id="sportKm" type="number" placeholder="Km si course"><input id="sportPace" placeholder="Allure ex. 6:20/km"><button class="btn sage" onclick="addSport()">Ajouter</button></div></div><div class="panel"><h2>Historique</h2><div class="list">${S.sportSessions.slice(-8).reverse().map(s=>`<div class="item">${s.date} · ${s.type} ${s.focus||''} ${s.km?'· '+s.km+' km':''}</div>`).join('')||'<div class="sub">Aucune séance.</div>'}</div></div></div>`} function addSport(){S.sportSessions.push({date:sportDate.value,type:sportType.value,focus:sportFocus.value,km:sportKm.value,pace:sportPace.value});S.hobbies[0][2]++;earn(15,'Sport');save()}
function renderCulture(){let types=['Tous','Film','Série','Animé','Livre'];let colls=[...new Set(S.culture.map(c=>c.collection))];let fType=window.cType||'Tous', fColl=window.cColl||'Toutes';let list=S.culture.filter(c=>(fType==='Tous'||c.type===fType)&&(fColl==='Toutes'||c.collection===fColl));let counts=['Film','Série','Animé','Livre'].map(t=>`<div class="metric"><b>${S.culture.filter(c=>c.type===t&&!['Vu','Lu'].includes(c.status)).length}</b>${t==='Livre'?'Livres à lire':t+'s à voir'}</div>`).join('');q('culture').innerHTML=`<div class="grid"><div class="cards">${counts}</div><div class="panel"><h2>Culture surprise</h2><div class="row"><select id="surpCat"><option>Tous</option>${types.slice(1).map(t=>`<option>${t}</option>`).join('')}<option>Disney</option><option>Marvel</option></select><button class="btn sage" onclick="cultureSurprise()">Tirer</button></div><div id="culturePick" class="suggestion" style="margin-top:10px">Choisis une catégorie.</div></div><div class="panel"><h2>Bibliothèque</h2><div class="filters"><select onchange="window.cType=this.value;render()">${types.map(t=>`<option ${t===fType?'selected':''}>${t}</option>`).join('')}</select><select onchange="window.cColl=this.value;render()"><option>Toutes</option>${colls.map(c=>`<option ${c===fColl?'selected':''}>${c}</option>`).join('')}</select></div><div class="list" style="margin-top:10px">${list.slice(0,100).map(cultureLine).join('')}</div><div class="sub">${list.length} éléments. Les 100 premiers sont affichés pour garder l’app fluide.</div></div></div>`}
function cultureLine(c){return `<div class="item"><div class="between"><div><b>${c.type==='Livre'?'📚':c.type==='Série'?'📺':c.type==='Animé'?'🍿':'🎬'} ${c.title}</b><br><span class="sub">${c.collection} · ${c.status}</span></div><button onclick="toggleCulture('${c.id}')" class="btn small soft">${c.status==='Vu'||c.status==='Lu'?'✓':'à voir'}</button></div><div class="row">${[1,2,3,4,5].map(n=>`<button onclick="rateCulture('${c.id}',${n})">${n<=c.rating?'★':'☆'}</button>`).join('')}</div></div>`}
function toggleCulture(id){let c=S.culture.find(x=>x.id===id);c.status=(c.type==='Livre')?(c.status==='Lu'?'À lire':'Lu'):(c.status==='Vu'?'À voir':'Vu'); if(c.status==='Vu'||c.status==='Lu') earn(c.type==='Livre'?25:2,c.type);save()} function rateCulture(id,n){S.culture.find(x=>x.id===id).rating=n;save()} function cultureSurprise(){let cat=surpCat.value;let arr=S.culture.filter(c=>!['Vu','Lu'].includes(c.status)&&(cat==='Tous'||c.type===cat||c.collection===cat));let c=arr[Math.floor(Math.random()*arr.length)];culturePick.innerHTML=c?`${c.type==='Livre'?'📚':c.type==='Série'?'📺':c.type==='Animé'?'🍿':'🎬'} <b>${c.title}</b><br><span class="sub">${c.collection}</span>`:'Rien dans cette catégorie.'}
function renderTodo(){q('todo').innerHTML=`<div class="grid"><div class="panel"><h2>Ajouter une tâche</h2><div class="grid"><input id="todoTitle" placeholder="Titre"><input id="todoDate" type="date"><select id="todoCat"><option>Perso</option><option>Ménage</option><option>Admin</option><option>Santé</option><option>Appart</option></select><button class="btn sage" onclick="addTodo()">Ajouter</button></div></div><div class="panel"><h2>Mes tâches</h2><div class="list">${S.todos.map(t=>`<div class="item compact"><span>📅 ${t.title}<br><span class="sub">${t.date||'sans date'} · ${t.cat}</span></span><button class="btn small ${t.done?'soft':'sage'}" onclick="doneTodo('${t.id}')">${t.done?'fait':'ok'}</button></div>`).join('')||'<div class="sub">Aucune tâche.</div>'}</div></div></div>`} function addTodo(){S.todos.push({id:crypto.randomUUID(),title:todoTitle.value||'Nouvelle tâche',date:todoDate.value,cat:todoCat.value,done:false});save()} function doneTodo(id){let t=S.todos.find(x=>x.id===id);if(t&&!t.done){t.done=true;earn(t.cat==='Ménage'?10:3,t.cat)}save()}
function renderNutrition(){let d=S.foodLog.filter(f=>f.date===today());let kcal=d.reduce((a,f)=>a+f.kcal,0), prot=d.reduce((a,f)=>a+f.protein,0);let tab=window.nTab||'Favoris';let cats=['Favoris','PrepMyMeal','Frigo','Alcool','Ajouter'];q('nutrition').innerHTML=`<div class="grid"><div class="cards"><div class="metric"><b>${Math.round(kcal)} / 1700</b>Calories</div><div class="metric"><b>${prot.toFixed(1)} / 120g</b>Protéines</div></div><div class="panel"><div class="seg">${cats.map(c=>`<button class="${c===tab?'active':''}" onclick="window.nTab='${c}';render()">${c}</button>`).join('')}</div>${nutritionTab(tab)}</div><div class="panel"><h2>Journal du jour</h2><div class="list">${d.map(f=>`<div class="item compact"><span>${f.name}</span><span>${f.kcal} kcal · ${f.protein}g</span></div>`).join('')||'<div class="sub">Rien ajouté aujourd’hui.</div>'}</div></div></div>`}
function nutritionTab(tab){if(tab==='Ajouter')return `<div class="grid"><input id="foodName" placeholder="Aliment"><input id="foodKcal" type="number" placeholder="Calories"><input id="foodProt" type="number" placeholder="Protéines"><button class="btn sage" onclick="addCustomFood()">Ajouter au jour</button></div>`;let arr=S.foods.filter(f=>f.cat===tab);return `<div class="list">${arr.map(f=>`<div class="item compact"><span><b>${f.name}</b><br><span class="sub">${f.kcal} kcal · ${f.protein}g protéines</span></span><button class="btn small sage" onclick="eat('${f.name.replace(/'/g,"\\'")}')">+</button></div>`).join('')}</div>`}
function eat(n){let f=S.foods.find(x=>x.name===n);S.foodLog.push({date:today(),...f});save()} function addCustomFood(){S.foodLog.push({date:today(),name:foodName.value||'Aliment',kcal:Number(foodKcal.value)||0,protein:Number(foodProt.value)||0,cat:'Libre'});save()}
function renderSimple(id,title,arr){q(id).innerHTML=`<div class="grid"><div class="panel"><h2>${title}</h2><input id="${id}Title" placeholder="Titre"><textarea id="${id}Note" placeholder="Note"></textarea><button class="btn sage" onclick="addSimple('${id}','${arr}')">Ajouter</button></div><div class="panel"><div class="list">${S[arr].map(x=>`<div class="item"><b>${x.title}</b><br><span class="sub">${x.note||''}</span></div>`).join('')||'<div class="sub">Vide pour le moment.</div>'}</div></div></div>`} function addSimple(id,arr){S[arr].push({title:q(id+'Title').value||'Note',note:q(id+'Note').value,date:today()});save()} function renderCourses(){renderSimple('courses','Courses','courses')} function renderAppart(){renderSimple('appart','Appart · notes par pièce','appart')} function renderEnvies(){renderSimple('envies','Envies & achats à faire','envies')}
function renderProfil(){let ptsMonth=S.history.filter(h=>h.date.startsWith(month())).reduce((a,h)=>a+h.points,0), done=S.todos.filter(t=>t.done).length, km=S.sportSessions.filter(s=>s.date&&s.date.startsWith(month())).reduce((a,s)=>a+(Number(s.km)||0),0);let cultureStats=['Film','Série','Animé','Livre'].map(t=>`${t}: ${S.culture.filter(c=>c.type===t&&['Vu','Lu'].includes(c.status)).length}`).join('<br>');q('profil').innerHTML=`<div class="grid"><div class="panel"><h2>📊 Statistiques</h2><div class="cards"><div class="metric"><b>${S.points}</b>Points dispo</div><div class="metric"><b>${ptsMonth}</b>Points mois</div><div class="metric"><b>${done}</b>To do terminées</div><div class="metric"><b>${km.toFixed(1)}</b>Km mois</div><div class="metric"><b>${weekCount('skin')}/7</b>Skincare</div><div class="metric"><b>${weekCount('stretch')}/7</b>Stretching</div></div></div><div class="panel"><h2>🎬 Culture</h2>${cultureStats}</div><div class="panel"><h2>🎁 Récompenses</h2><div class="list">${S.rewards.map((r,i)=>`<div class="item compact"><span>${r.name}<br><span class="sub">${r.cost} pts</span></span><button class="btn small sage" onclick="buyReward(${i})">Acheter</button></div>`).join('')}</div><h3>Obtenues</h3><div class="list">${S.bought.map(b=>`<div class="item">${b.name} · ${b.date}</div>`).join('')||'<span class="sub">Aucune pour le moment.</span>'}</div></div><div class="panel"><h2>Sauvegarde</h2><button class="btn soft" onclick="exportData()">Exporter</button><textarea id="importBox" placeholder="Coller sauvegarde"></textarea><button class="btn sage" onclick="importData()">Importer</button></div></div>`} function buyReward(i){let r=S.rewards[i];if(S.points>=r.cost){S.points-=r.cost;S.bought.push({...r,date:today()});S.homeSuggestion='🎁 Récompense achetée : '+r.name}else S.homeSuggestion='Il manque encore des points pour '+r.name;save()} function exportData(){navigator.clipboard?.writeText(JSON.stringify(S));alert('Sauvegarde copiée')} function importData(){try{S=JSON.parse(importBox.value);save()}catch(e){alert('Import impossible')}}
function render(){renderHome();renderMood();renderHobbies();renderSport();renderCulture();renderTodo();renderNutrition();renderCourses();renderAppart();renderEnvies();renderProfil()} document.querySelectorAll('.tabs button').forEach(b=>b.onclick=()=>{document.querySelectorAll('main').forEach(m=>m.classList.remove('active'));q(b.dataset.tab).classList.add('active');document.querySelectorAll('.tabs button').forEach(x=>x.classList.toggle('active',x===b));b.scrollIntoView({inline:'center',behavior:'smooth',block:'nearest'});render()}); if('serviceWorker' in navigator)navigator.serviceWorker.register('./sw.js');render();
</script></body></html>
