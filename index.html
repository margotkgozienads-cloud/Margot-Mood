function nav(x){document.querySelectorAll('main').forEach(m=>m.classList.remove('active'));q(x).classList.add('active');document.querySelectorAll('.tabs button').forEach(b=>{let a=b.dataset.tab===x;b.classList.toggle('active',a);if(a)b.scrollIntoView({behavior:'smooth',inline:'center',block:'nearest'})});render(x)} function pct(a,b){return Math.min(100,Math.round((a/b)*100||0))} function card(s){return `<div class="card">${s}</div>`} function totals(){return S.mealLog.filter(x=>x.date===today()).reduce((a,x)=>({kcal:a.kcal+x.kcal,prot:a.prot+x.prot}),{kcal:0,prot:0})}
function renderHome(){ensure();let n=totals(),open=S.todo.filter(x=>!x.done).length;q('home').innerHTML=`<div class="grid3">${[['⭐','Points',S.points],['💪','Sport',S.week.sport+'/4'],['🌿','Skincare',S.week.skincare+'/7'],['🧘','Stretching',S.week.stretch+'/7'],['👣','Pas',fmt(S.daily.steps)+'/10k'],['📅','To do',open]].map(x=>`<div class="stat"><span>${x[0]} ${x[1]}</span><b>${x[2]}</b></div>`).join('')}</div>${card(`<div class="mini">Actions rapides</div><div class="grid" style="margin-top:10px"><button class="btn nude" onclick="idea('anti')">🎲 Anti-scroll</button><button class="btn nude" onclick="nav('mood')">😊 Mood</button><button class="btn nude" onclick="idea('task')">📅 Tâche douce</button><button class="btn nude" onclick="idea('culture')">🍿 Culture surprise</button></div><div class="section">✨ Suggestion du moment</div><p>${S.suggestion}</p>`)}${card(`<div class="section">Mes quotidiens</div><div class="list"><div class="item compact"><span class="emoji">🌿</span><b>Skincare</b><button class="btn light" onclick="daily('skincare')">${S.daily.skincare?'Fait':'À faire'}</button></div><div class="item compact"><span class="emoji">🧘</span><b>Stretching</b><button class="btn light" onclick="daily('stretch')">${S.daily.stretch?'Fait':'À faire'}</button></div><div class="item"><div class="line"><b>👣 Pas</b><span>${fmt(S.daily.steps)} / 10 000</span></div><div class="progress"><div class="bar" style="width:${pct(S.daily.steps,10000)}%"></div></div><div class="row" style="margin-top:10px"><input id="steps" type="number" placeholder="Nombre de pas"><button class="btn light" onclick="setSteps()">Mettre à jour</button><button class="btn light" onclick="S.daily.steps+=1000;if(S.daily.steps>=10000)addPts(score.steps,'10k pas');save();renderHome()">+1000</button></div></div></div>`)}${card(`<div class="section">🍽 Nutrition aujourd’hui</div>${nutriBars(n)}<button class="btn sage" onclick="nav('nutrition')">Ouvrir Nutrition</button>`)}`}
function nutriBars(n){return `<div class="item"><div class="line"><b>Calories</b><span>${Math.round(n.kcal)} / 1700</span></div><div class="progress"><div class="bar" style="width:${pct(n.kcal,1700)}%"></div></div></div><div class="item"><div class="line"><b>Protéines</b><span>${Math.round(n.prot)} / 120 g</span></div><div class="progress"><div class="bar" style="width:${pct(n.prot,120)}%"></div></div></div>`}
function daily(k){if(!S.daily[k]){S.daily[k]=true;if(k==='skincare'){S.week.skincare++;addPts(score.skincare,'skincare')}else{S.week.stretch++;addPts(score.stretch,'stretching')}}else S.daily[k]=false;save();renderHome()}
function setSteps(){S.daily.steps=Number(q('steps').value||0);if(S.daily.steps>=10000)addPts(score.steps,'10k pas');save();renderHome()}
function idea(t){let p=t==='task'?S.todo.filter(x=>!x.done).map(x=>'📅 '+x.title):t==='culture'?S.culture.filter(x=>x.status!=='Vu').map(x=>x.type==='Série'?'📺 '+x.title:x.type==='Livre'?'📚 '+x.title:'🎬 '+x.title):['Lire 10 pages.','Faire une marche de 15 minutes.','Ranger une petite zone pendant 8 minutes.','Boire un thé puis choisir un film.'];S.suggestion=p.length?p[Math.floor(Math.random()*p.length)]:'Rien à proposer pour le moment.';save();renderHome()}
const moodIdeas={"😴 Fatiguée":['Skincare + pyjama confortable.','Lire 10 pages seulement.','Regarder un Disney doux.','Faire 8 minutes de stretching.'],"😔 Moral bas":['Envoyer un message à quelqu’un de sûr.','Préparer une boisson chaude.','Câliner les animaux 10 minutes.','Choisir un film feel good.'],"😐 Bof":['Faire une mini marche de 15 minutes.','Ranger une seule surface.','Ajouter une envie dans Atelier.','Culture surprise.'],"😊 Bien":['Avancer une tâche douce.','Faire 10 photos.','Lire 15 pages.','Préparer demain.'],"🚀 Motivée":['Séance sport.','Projet appart : ajouter une note.','Formation photo 20 minutes.','To do prioritaire.'],"🤯 Stressée":['Respirer 5 minutes.','Stretching doux.','Écrire ce qui tourne en boucle.','Faire une tâche administrative rapide.'],"🥰 Heureuse":['Immortaliser la journée en photo.','Partager un message à un proche.','Ajouter une envie plaisir.','Regarder quelque chose de léger.']};
function renderMood(){let feelings=Object.keys(moodIdeas);q('mood').innerHTML=`${card(`<div class="section">Mood</div><p class="small">Choisis comment tu te sens. Atelier te donne une seule idée. Si elle ne te parle pas, repioche.</p><div class="grid">${feelings.map(f=>`<button class="btn light" onclick="S.mood.feeling='${f}';newMoodIdea();renderMood()">${f}</button>`).join('')}</div>`)}${card(`<div class="mini">Idée du moment</div><div class="section">${S.mood.feeling||'Choisis une humeur'}</div><p style="font-size:1.1rem;line-height:1.45">${S.mood.idea||'Une idée apparaîtra ici.'}</p><div class="row"><button class="btn sage" onclick="newMoodIdea();renderMood()">🔄 Une autre idée</button><button class="btn light" onclick="S.suggestion='Mood · '+S.mood.idea;save();nav('home')">✅ Ça me va</button></div>`)}`}
function newMoodIdea(){let f=S.mood.feeling||'😐 Bof', arr=moodIdeas[f]||moodIdeas['😐 Bof'];S.mood.idea=arr[Math.floor(Math.random()*arr.length)];save()}
function renderHobbies(){let hs=['Sport','Lecture','Photo','Ménage','Animaux','Amis','Famille','Développement perso','Actualité','Jeux vidéo'];let em={Sport:'💪',Lecture:'📖',Photo:'📸',Ménage:'🧹',Animaux:'🐾',Amis:'🤍',Famille:'🏡','Développement perso':'✨',Actualité:'📰','Jeux vidéo':'🎮'};q('hobbies').innerHTML=`<div class="section">Hobbies</div><div class="list">${hs.map(h=>`<div class="item compact"><span class="emoji">${em[h]}</span><b>${h}</b><div class="row"><button class="btn light" onclick="hobby('${h}',-1)">−</button><span>${S.hobbies[h]||0}</span><button class="btn light" onclick="hobby('${h}',1)">+</button></div></div>`).join('')}</div>`}
function hobby(h,n){S.hobbies[h]=Math.max(0,(S.hobbies[h]||0)+n);if(n>0){let pts=h==='Ménage'?score.menage:h==='Photo'?score.photo:h==='Sport'?score.sport:5;if(h==='Sport')S.week.sport++;addPts(pts,h)}save();renderHobbies();renderHome()}
function renderSport(){let km=S.sportSessions.filter(x=>(x.date||'').slice(0,7)===month()).reduce((a,x)=>a+Number(x.km||0),0);q('sport').innerHTML=`<div class="grid3">${[['Séances mois',S.sportSessions.filter(x=>(x.date||'').slice(0,7)===month()).length],['Sport semaine',S.week.sport+'/4'],['Stretching',S.week.stretch+'/7'],['Km mois',km.toFixed(1)],['Pas',fmt(S.daily.steps)+'/10k'],['Points',S.points]].map(x=>`<div class="stat"><span>${x[0]}</span><b>${x[1]}</b></div>`).join('')}</div>${card(`<div class="section">Ajouter une séance</div><div class="grid"><input type="date" id="sDate" value="${today()}"><select id="sType"><option>Renfo</option><option>Pilates</option><option>Course à pied</option></select><select id="sFocus"><option>Haut du corps</option><option>Bas du corps</option><option>Full body</option><option>Abs</option></select><input id="sKm" type="number" step="0.1" placeholder="Km si course"><input id="sPace" placeholder="Allure ex 6:20/km"></div><button class="btn sage" onclick="addSport()">Ajouter séance</button>`)}${card(`<div class="section">Mensurations</div><div class="grid"><input id="mDate" type="date" value="${today()}"><input id="mWeight" placeholder="Poids"><input id="mWaist" placeholder="Taille"><input id="mHip" placeholder="Hanches"><input id="mThigh" placeholder="Cuisse"><input id="mArm" placeholder="Bras"></div><textarea id="mNote" placeholder="Note"></textarea><button class="btn light" onclick="addMeasure()">Ajouter</button>`)}`}
function addSport(){S.sportSessions.push({id:id(),date:q('sDate').value,type:q('sType').value,focus:q('sFocus').value,km:q('sKm').value,pace:q('sPace').value});S.week.sport++;addPts(score.sport,'séance sport');save();renderSport();renderHome()} function addMeasure(){S.mensurations.push({id:id(),date:q('mDate').value,weight:q('mWeight').value,waist:q('mWaist').value,hip:q('mHip').value,thigh:q('mThigh').value,arm:q('mArm').value,note:q('mNote').value});save();renderSport()}
function foodCard(f,i){return f.xl?`<div class="item"><div class="line"><b>🍱 ${f.name}</b><span class="pill">XL 2 portions</span></div><p class="small">Total : ${f.kcal} kcal · ${f.prot} g protéines</p><div class="row"><button class="btn light" onclick="addFood(${i},.5)">+ 1 portion</button><button class="btn sage" onclick="addFood(${i},1)">+ XL complet</button></div></div>`:`<button class="btn light foodBtn" onclick="addFood(${i},1)">${f.name}<br><span class="small">${f.kcal} kcal · ${f.prot} g protéines</span></button>`}
function renderNutrition(){let n=totals(),tab=S.nutritionTab||'Favoris',cats=['Favoris','PrepMyMeal','Frigo','Alcool','Ajouter'];let items=S.foods.map((f,i)=>({f,i})).filter(o=>o.f.cat===tab);q('nutrition').innerHTML=`${card(`<div class="section">Nutrition</div>${nutriBars(n)}`)}<div class="tabs" style="position:static;box-shadow:none;margin:8px 0 12px">${cats.map(c=>`<button class="${tab===c?'active':''}" onclick="S.nutritionTab='${c}';save();renderNutrition()">${c}</button>`).join('')}</div>${tab==='Ajouter'?card(`<div class="section">Ajouter un aliment</div><div class="grid"><input id="fName" placeholder="Nom"><select id="fCat"><option>Favoris</option><option>PrepMyMeal</option><option>Frigo</option><option>Alcool</option></select><input id="fKcal" type="number" placeholder="Calories"><input id="fProt" type="number" step="0.1" placeholder="Protéines g"></div><button class="btn sage" onclick="createFood()">Ajouter à ma base</button>`):card(`<div class="section">${tab}</div><div class="foodSections">${items.map(o=>foodCard(o.f,o.i)).join('')}</div>`)}${card(`<div class="section">Journal du jour</div><div class="list">${S.mealLog.filter(x=>x.date===today()).map(x=>`<div class="item line"><span>${x.name}<br><span class="small">${Math.round(x.kcal)} kcal · ${Math.round(x.prot*10)/10} g prot</span></span><button class="btn light" onclick="S.mealLog=S.mealLog.filter(m=>m.id!=='${x.id}');save();renderNutrition();renderHome()">Supprimer</button></div>`).join('')||'<p class="small">Aucun aliment ajouté aujourd’hui.</p>'}</div><button class="btn light" onclick="proteinBonus()">Objectif protéines atteint +5 pts</button>`)}`}
function addFood(i,portion){let f=S.foods[i];S.mealLog.push({id:id(),date:today(),name:f.name+(f.xl&&portion===.5?' · 1 portion':''),kcal:Math.round(f.kcal*portion),prot:Math.round(f.prot*portion*10)/10});save();renderNutrition();renderHome()} function createFood(){S.foods.push({name:q('fName').value||'Aliment',cat:q('fCat').value,kcal:Number(q('fKcal').value||0),prot:Number(q('fProt').value||0)});save();renderNutrition()} function proteinBonus(){let n=totals();if(n.prot>=120&&!S.daily.proteinBonus){S.daily.proteinBonus=true;addPts(score.protein,'objectif protéines')}else{S.suggestion='Objectif protéines pas encore atteint ou déjà récompensé aujourd’hui.';save()}renderHome()}
function renderCulture(){let t=q('cType')?.value||'Tous',cat=q('cCat')?.value||'Toutes',cats=[...new Set(S.culture.map(x=>x.cat))],items=S.culture.filter(x=>(t==='Tous'||x.type===t)&&(cat==='Toutes'||x.cat===cat));q('culture').innerHTML=`<div class="grid">${['Film','Série','Animé','Livre'].map(tp=>`<div class="stat"><span>${tp==='Livre'?'📚 Livres à lire':tp==='Série'?'📺 Séries à voir':tp==='Animé'?'🍿 Animés à voir':'🎬 Films à voir'}</span><b>${S.culture.filter(x=>x.type===tp&&x.status!=='Vu').length}</b></div>`).join('')}</div>${card(`<div class="section">Culture</div><div class="filters"><select id="cType" onchange="renderCulture()"><option>Tous</option>${['Film','Série','Animé','Livre'].map(x=>`<option ${t===x?'selected':''}>${x}</option>`).join('')}</select><select id="cCat" onchange="renderCulture()"><option>Toutes</option>${cats.map(x=>`<option ${cat===x?'selected':''}>${x}</option>`).join('')}</select></div><button class="btn sage" onclick="cultureSurprise()">🍿 Surprise culture</button>`)}<div class="list">${items.slice(0,90).map(x=>`<div class="item"><div class="line"><b>${x.type==='Série'?'📺':x.type==='Livre'?'📚':'🎬'} ${x.title}</b><span class="pill">${x.cat}</span></div><div class="row"><button class="btn light" onclick="toggleCulture('${x.id}')">${x.status==='Vu'?'Vu':'À voir'}</button><button class="btn light" onclick="toggleFav('${x.id}')">${x.fav?'❤':'♡'}</button><span class="stars">${[1,2,3,4,5].map(n=>`<button onclick="rate('${x.id}',${n})">${x.rating>=n?'★':'☆'}</button>`).join('')}</span></div></div>`).join('')}</div>`}
function toggleFav(i){let x=S.culture.find(a=>a.id===i);x.fav=!x.fav;save();renderCulture()} function toggleCulture(i){let x=S.culture.find(a=>a.id===i);x.status=x.status==='Vu'?'À voir':'Vu';if(x.status==='Vu')addPts(x.type==='Livre'?score.livre:x.type==='Série'?score.serie:score.film,x.type+' terminé');save();renderCulture()} function rate(i,n){S.culture.find(x=>x.id===i).rating=n;save();renderCulture()} function cultureSurprise(){let arr=S.culture.filter(x=>x.status!=='Vu');S.suggestion=arr.length?'Culture surprise · '+arr[Math.floor(Math.random()*arr.length)].title:'Aucun contenu.';save();nav('home')}
function renderTodo(){q('todo').innerHTML=card(`<div class="section">To do</div><div class="grid"><input id="tdTitle" placeholder="Nouvelle tâche"><input id="tdDate" type="date"><select id="tdCat"><option>Perso</option><option>Ménage</option><option>Administratif</option><option>Maison</option><option>Santé</option></select></div><button class="btn sage" onclick="addTodo()">Ajouter</button>`)+`<div class="list">${S.todo.map(x=>`<div class="item ${x.done?'done':''} line"><span>📅 ${x.title}<br><span class="small">${x.date||'sans date'} · ${x.cat}</span></span><button class="btn light" onclick="doneTodo('${x.id}')">${x.done?'Réouvrir':'Fait'}</button></div>`).join('')}</div>`} function addTodo(){S.todo.push({id:id(),title:q('tdTitle').value||'Tâche',date:q('tdDate').value,cat:q('tdCat').value,done:false});save();renderTodo();renderHome()} function doneTodo(i){let x=S.todo.find(a=>a.id===i);x.done=!x.done;if(x.done)addPts(x.cat==='Ménage'?score.menage:score.task,'to do');save();renderTodo();renderHome()}
function renderCourses(){q('courses').innerHTML=card(`<div class="section">Courses</div><div class="grid"><input id="coTitle" placeholder="Article"><input id="coQty" placeholder="Quantité"></div><button class="btn sage" onclick="S.courses.push({id:id(),title:q('coTitle').value,qty:q('coQty').value,done:false});save();renderCourses()">Ajouter</button>`)+`<div class="list">${S.courses.map(x=>`<div class="item line"><span>${x.done?'✅':'☐'} ${x.title} <span class="small">${x.qty||''}</span></span><button class="btn light" onclick="let y=S.courses.find(a=>a.id==='${x.id}');y.done=!y.done;save();renderCourses()">OK</button></div>`).join('')}</div>`}
function renderAppart(){q('appart').innerHTML=card(`<div class="section">Appart</div><div class="grid"><select id="apRoom"><option>Salon</option><option>Cuisine</option><option>Chambre</option><option>Salle de bain</option><option>Entrée</option><option>Rangement</option><option>Inspiration générale</option></select><input id="apTitle" placeholder="Titre"></div><textarea id="apNote" placeholder="Note"></textarea><input id="apPhoto" type="file" accept="image/*"><button class="btn sage" onclick="addAppart()">Ajouter</button>`)+`<div class="list">${S.appart.map(x=>`<div class="item"><span class="pill">${x.room}</span><h3>${x.title}</h3><p>${x.note||''}</p>${x.photo?`<img class="img" src="${x.photo}">`:''}</div>`).join('')}</div>`} function addAppart(){let f=q('apPhoto').files[0],o={id:id(),room:q('apRoom').value,title:q('apTitle').value,note:q('apNote').value};if(f){let r=new FileReader();r.onload=()=>{o.photo=r.result;S.appart.push(o);save();renderAppart()};r.readAsDataURL(f)}else{S.appart.push(o);save();renderAppart()}}
function renderEnvies(){q('envies').innerHTML=card(`<div class="section">Envies</div><div class="grid"><input id="enTitle" placeholder="Envie / achat à faire"><input id="enBudget" placeholder="Budget"><select id="enCat"><option>Achat à faire</option><option>Expérience</option><option>Sortie</option><option>Voyage</option><option>Bien-être</option><option>Maison / appart</option></select></div><textarea id="enNote" placeholder="Note"></textarea><button class="btn sage" onclick="S.envies.push({id:id(),title:q('enTitle').value,budget:q('enBudget').value,cat:q('enCat').value,note:q('enNote').value});save();renderEnvies()">Ajouter</button>`)+`<div class="list">${S.envies.map(x=>`<div class="item"><b>${x.title}</b><br><span class="small">${x.cat} · ${x.budget||''}</span><p>${x.note||''}</p></div>`).join('')}</div>`}
function renderProfil(){let n=totals(),km=S.sportSessions.filter(x=>(x.date||'').slice(0,7)===month()).reduce((a,x)=>a+Number(x.km||0),0);q('profil').innerHTML=`${card(`<div class="section">Statistiques</div><div class="grid3">${[['Points dispo',S.points],['Points totaux',S.totalPoints],['Sport semaine',S.week.sport+'/4'],['Stretching',S.week.stretch+'/7'],['Km mois',km.toFixed(1)],['Calories jour',Math.round(n.kcal)],['Prot jour',Math.round(n.prot)+' g'],['To do ouvertes',S.todo.filter(x=>!x.done).length],['Culture',S.culture.filter(x=>x.status==='Vu').length+' vus']].map(x=>`<div class="stat"><span>${x[0]}</span><b>${x[1]}</b></div>`).join('')}</div>`)}${card(`<div class="section">Récompenses</div><div class="list">${rewards.map(r=>`<div class="item line"><span>${r[0]} <b>${r[1]}</b><br><span class="small">${r[2]} pts</span></span><button class="btn light" onclick="buy('${r[1]}',${r[2]},'${r[0]}')">Acheter</button></div>`).join('')}</div><div class="section">Obtenues</div>${S.rewards.map(r=>`<div class="item">${r.emoji} ${r.name} · ${r.date}</div>`).join('')||'<p class="small">Aucune pour le moment.</p>'}`)}${card(`<div class="section">Sauvegarde</div><button class="btn light" onclick="q('backup').value=JSON.stringify(S)">Exporter</button><textarea id="backup"></textarea><button class="btn light" onclick="try{S=JSON.parse(q('backup').value);save();render()}catch(e){alert('Sauvegarde invalide')}">Importer</button><button class="btn nude" onclick="if(confirm('Reset semaine uniquement ?')){S.week={sport:0,skincare:0,stretch:0};S.daily={date:today(),skincare:false,stretch:false,steps:0,proteinBonus:false};save();render()}">Reset semaine</button>`)}`}
function buy(name,cost,emoji){if(S.points<cost){S.suggestion='Pas assez de points pour '+name;save();nav('home');return}S.points-=cost;S.rewards.push({name,cost,emoji,date:today()});S.suggestion='Récompense achetée · '+emoji+' '+name;save();renderProfil()}
function render(x){ensure();({home:renderHome,mood:renderMood,hobbies:renderHobbies,sport:renderSport,nutrition:renderNutrition,culture:renderCulture,todo:renderTodo,courses:renderCourses,appart:renderAppart,envies:renderEnvies,profil:renderProfil}[x||document.querySelector('main.active').id]||renderHome)()}
q('tabs').innerHTML=tabs.map(t=>`<button data-tab="${t[0]}" onclick="nav('${t[0]}')">${t[1]}</button>`).join('');q('tabs').querySelector('button').classList.add('active');renderHome();
</script></body></html>
